# Provider endpoints for opencode-bridge (one per provider)
opencode_bridge_endpoints:
  groq: "http://localhost:5001"
  gemini: "http://localhost:5002"
  mistral: "http://localhost:5003"

# Model maps (keys = suffix after provider prefix)
openrouter_model_map:
  # Premium / paid (valid current OpenRouter slugs)
  opus-5: "anthropic/claude-opus-5"
  opus-4.8: "anthropic/claude-opus-4.8"
  sonnet-5: "anthropic/claude-sonnet-5"
  haiku-4.5: "anthropic/claude-haiku-4.5"
  deepseek: "deepseek/deepseek-chat-v3.1"
  qwen-coder: "qwen/qwen3-coder"
  # Free tier — any ":free" slug is auto-tagged FREE in the /model picker.
  free-nemotron-ultra: "nvidia/nemotron-3-ultra-550b-a55b:free"
  free-nemotron-super: "nvidia/nemotron-3-super-120b-a12b:free"
  free-gemma: "google/gemma-4-31b-it:free"
  free-gpt-oss: "openai/gpt-oss-20b:free"
  free-north-code: "cohere/north-mini-code:free"

groq_model_map:
  llama3: "llama-3.3-70b-versatile"
  mixtral: "mixtral-8x7b-32768"
  gemma: "gemma2-9b-it"

gemini_model_map:
  flash: "gemini-1.5-flash"
  pro: "gemini-1.5-pro"
  flash-8b: "gemini-1.5-flash-8b"

nim_model_map:
  llama3: "meta/llama-3.1-70b-instruct"
  nemotron: "nvidia/nemotron-3-ultra"
  mixtral: "mistralai/mixtral-8x7b-instruct-v0.1"

mistral_model_map:
  large: "mistral-large-latest"
  small: "mistral-small-latest"
  codestral: "codestral-latest"

cerebras_model_map:
  gpt-oss: "gpt-oss-120b"
  glm: "zai-glm-4.7"

opencode_bridge_model_map:
  groq:
    llama3: "groq/llama-3.3-70b-versatile"
    mixtral: "groq/mixtral-8x7b-32768"
  gemini:
    flash: "gemini/gemini-1.5-flash"
    pro: "gemini/gemini-1.5-pro"
  mistral:
    large: "mistral/mistral-large-latest"
    small: "mistral/mistral-small-latest"

# Fallback chains per provider (registered backend provider_names).
# The primary backend (owner of the model prefix) is implicit; these are the
# fallbacks tried after it, in order. "opencode" reruns the same provider via
# its opencode-bridge instance, so the shared model key maps cleanly.
fallback_chains:
  groq: ["opencode"]
  gemini: ["opencode"]
  mistral: ["opencode"]
  nim: []
  cerebras: []
  openrouter: []
  opencode: []
