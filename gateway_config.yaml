# opencode's own hosted models ("OpenCode Zen"), served OpenAI-compatibly.
# Called directly (no `opencode serve` needed) so tool-use works. Free models
# use the shared public key; set OPENCODE_API_KEY in .env for higher limits.
opencode_base_url: "https://opencode.ai/zen/v1"

# Model maps (keys = suffix after the `claude-<provider>-` prefix).
# Slugs verified live against each provider's /models on 2026-08-12.
openrouter_model_map:
  # Premium / paid (valid current OpenRouter slugs)
  opus-5: "anthropic/claude-opus-5"
  opus-4.8: "anthropic/claude-opus-4.8"
  sonnet-5: "anthropic/claude-sonnet-5"
  haiku-4.5: "anthropic/claude-haiku-4.5"
  deepseek: "deepseek/deepseek-chat-v3.1"
  qwen-coder: "qwen/qwen3-coder"
  # Free tier — any ":free" slug (or "free-*" key) is auto-tagged FREE 🆓.
  free-nemotron-ultra: "nvidia/nemotron-3-ultra-550b-a55b:free"
  free-nemotron-super: "nvidia/nemotron-3-super-120b-a12b:free"
  free-nemotron-nano: "nvidia/nemotron-3-nano-30b-a3b:free"
  free-nemotron-nano-omni: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
  free-nemotron-lightning: "nvidia/nemotron-3.5-lightning:free"
  free-nemotron-12b-vl: "nvidia/nemotron-nano-12b-v2-vl:free"
  free-nemotron-9b: "nvidia/nemotron-nano-9b-v2:free"
  free-gemma: "google/gemma-4-31b-it:free"
  free-gemma-26b: "google/gemma-4-26b-a4b-it:free"
  free-gpt-oss: "openai/gpt-oss-20b:free"
  free-north-code: "cohere/north-mini-code:free"
  free-ling-tiny: "inclusionai/ling-3.0-tiny:free"
  free-lfm: "liquid/lfm-2.5-2.6b:free"
  free-laguna-s: "poolside/laguna-s-2.1:free"
  free-laguna-xs: "poolside/laguna-xs-2.1:free"

groq_model_map:
  # All Groq chat models are free-tier.
  llama3: "llama-3.3-70b-versatile"
  llama-8b: "llama-3.1-8b-instant"
  gpt-oss-120b: "openai/gpt-oss-120b"
  gpt-oss-20b: "openai/gpt-oss-20b"
  qwen3: "qwen/qwen3.6-27b"
  compound: "groq/compound"
  compound-mini: "groq/compound-mini"

gemini_model_map:
  # gemini-1.5-* retired; using current 2.5 / 3.x lines + rolling aliases.
  flash: "gemini-flash-latest"
  pro: "gemini-pro-latest"
  flash-lite: "gemini-flash-lite-latest"
  # gemini-2.5-* removed: "no longer available to new users" on this API tier.
  "3-flash": "gemini-3-flash-preview"
  "3.1-pro": "gemini-3.1-pro-preview"
  "3.5-flash": "gemini-3.5-flash"
  "3.6-flash": "gemini-3.6-flash"
  gemma-31b: "gemma-4-31b-it"
  gemma-26b: "gemma-4-26b-a4b-it"

nim_model_map:
  llama3: "meta/llama-3.1-70b-instruct"
  nemotron: "nvidia/nemotron-3-ultra"
  mixtral: "mistralai/mixtral-8x7b-instruct-v0.1"

mistral_model_map:
  large: "mistral-large-latest"
  medium: "mistral-medium-latest"
  small: "mistral-small-latest"
  codestral: "codestral-latest"
  devstral: "devstral-latest"
  devstral-medium: "devstral-medium-latest"
  magistral: "magistral-small-latest"
  ministral-14b: "ministral-14b-latest"
  ministral-8b: "ministral-8b-latest"
  ministral-3b: "ministral-3b-latest"
  code: "mistral-code-latest"

cerebras_model_map:
  # Requires CEREBRAS_API_KEY; slugs unverified while the key is unset.
  gpt-oss: "gpt-oss-120b"
  glm: "zai-glm-4.7"

# opencode's own hosted models (served by `opencode serve`). Keys become
# `claude-opencode-<key>`; values are opencode provider modelIDs. All free.
# Discovery also auto-merges whatever the live opencode instance reports.
opencode_model_map:
  big-pickle: "big-pickle"
  deepseek-v4-flash: "deepseek-v4-flash-free"
  hy3: "hy3-free"
  mimo: "mimo-v2.5-free"
  laguna-s: "laguna-s-2.1-free"
  ling-tiny: "ling-3.0-tiny-free"
  nemotron-lightning: "nemotron-3.5-lightning-free"
  nemotron-ultra: "nemotron-3-ultra-free"

# Fallback chains per provider (registered backend provider_names).
# The primary backend (owner of the model prefix) is implicit; these are the
# fallbacks tried after it, in order. opencode is standalone (its models are
# not reachable through any other provider), so no chain routes to it.
fallback_chains:
  groq: []
  gemini: []
  mistral: []
  nim: []
  cerebras: []
  openrouter: []
  opencode: []
